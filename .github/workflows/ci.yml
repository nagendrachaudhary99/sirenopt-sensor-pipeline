name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: Unit tests
        run: cd build && ctest --output-on-failure
      - name: Demo run + independent Python cross-check
        run: |
          ./build/pipeline 4 2000 /tmp/pipeline.binlog
          python3 tools/analyze_log.py /tmp/pipeline.binlog | tee /tmp/xcheck.log
          grep -q "records=8000 rejected=0" /tmp/xcheck.log
      - name: Concurrency stress: full-speed producers, zero corruption
        run: |
          ./build/pipeline 8 20000 /tmp/stress.binlog 0 | tee /tmp/stress.log
          grep -q "seq_gap=0 duplicate=0 ts_regression=0" /tmp/stress.log
          python3 tools/analyze_log.py /tmp/stress.binlog | grep -q "records=160000 rejected=0"
